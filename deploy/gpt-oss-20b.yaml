apiVersion: foundrylocal.azure.com/v1
kind: ModelDeployment
metadata:
  name: gpt-oss-20b-cpu
  namespace: foundry-local-operator
  labels:
    app.kubernetes.io/part-of: local-pdf-assistant
spec:
  displayName: GPT-OSS-20B CPU evaluation
  model:
    assetId: azureml://registries/azureml/models/gpt-oss-20b-generic-cpu/versions/1
  workloadType: generative
  compute: cpu
  runtime: onnx-genai
  replicas: 1
  nodeSelector:
    kubernetes.azure.com/agentpool: slmnodepool
  endpoint:
    exposure: internal
  resources:
    requests:
      cpu: "8"
      memory: 24Gi
    limits:
      cpu: "16"
      memory: 48Gi
